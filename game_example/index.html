<!DOCTYPE html>
<html>
  <head>
    
  </head>
  <body style="display: flex;justify-content: center; align-items: center;">
    <canvas id="main_canvas" width="1280" height="720"></canvas>
    <script>
        class Game {
            #tmp = {};
            #timeInterval = -1;
            #module = Object();
            onModuleLoad = () => {};
            frame_rate = 60;

            constructor(canvas, nick, game_name, draw_script_file_url, onModuleLoad){
                this.canvas = canvas;
                this.nick = nick;
                this.game_name = game_name;
                this.draw_script_file_url = draw_script_file_url;
                
                if(document.cookie && document.cookie !== ''){
                    const cookies = document.cookie.split(';');
                    for (let i = 0; i < cookies.length; i++) {
                        const cookie = cookies[i].trim();
                        if (cookie.substring(0, 10) === ('csrftoken=')) {
                            this.csrf_cookie = decodeURIComponent(cookie.substring(10));
                            break;
                        }
                    }
                }
                import(/* webpackIgnore: true */ draw_script_file_url).then(
                    (obj) => {
                        this.#module = obj;
                        onModuleLoad();
                    }
                ).catch(
                    (reason) => {
                        console.error("Draw script load error with " + reason);
                    }
                );
            }

            start(){
                let finish = (game_data) => {
                    clearInterval(this.#timeInterval);
                    game_data.nick = this.nick;
                    fetch('/gamefinish/', {
                        method: "POST",
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrftoken
                        },
                        body: JSON.stringify(game_data)
                    }).then((response) => {
                        response.json().then(
                            (response_json) => {
                                this.#module.finish(this.canvas, this.#tmp, response_json.score);
                            }
                        )
                    });
                },
                game = () => {
                    this.#tmp = this.#module.proceed(this.canvas, this.#tmp, finish);
                };

                fetch("/gameinit/", {
                    method: "POST",
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken
                    },
                    body: JSON.stringify({
                        game_name: this.game_name,
                        nick: this.nick
                    })
                }).then(
                    (response) => {
                        response.json().then(
                            (init_game_data) => {
                                this.#tmp = this.#module.init(canvas, init_game_data.init, this.#tmp);
                                this.#timeInterval = setInterval(game, Math.floor(1 / this.frame_rate) * 1000);
                            }
                        )
                    } 
                ).catch(
                    (reason) => {
                        console.error("Game init error with" + reason);
                    }
                );
            }
        }

        const canvas = document.getElementById("main_canvas");

        fetch('/gamelinks/').then(
            (response) => {
                response.json().then(
                    (json_response) => {
                        let game = new Game(canvas, "test_user", "test_game", "/media/" + json_response["test_game"], () => {
                        game.start();
                        });
                    }
                )
            }
        );
    </script>
  </body>
</html>
