<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <title>Игровая тестовая площадка</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <style>
    /* Базовые стили */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #f0f0f0;
    }

    /* Главный контейнер для разделения на меню и игровое поле */
    .main-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Стили для верхнего меню выбора игры */
    .controls-panel {
      flex-shrink: 0;
      padding: 10px;
      background-color: #333;
      color: white;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 10;
    }
    .controls-panel label {
      font-weight: 500;
    }
    .controls-panel select, .controls-panel button {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #555;
      background-color: #444;
      color: white;
      border-radius: 4px;
    }
    .controls-panel button {
      cursor: pointer;
      background-color: #007bff;
      border-color: #007bff;
      font-weight: 500;
    }
    .controls-panel button:hover {
      background-color: #0056b3;
    }

    /* Контейнер, центрирующий canvas */
    .canvas-container {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background-color: #eac49c; /* Цвет фона из вашего примера */
      touch-action: none; /* Отключает стандартные жесты браузера (скролл, зум) */
      user-select: none; /* Запрещает выделение текста */
    }

    /* Стили самого canvas */
    #main_canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      height: auto;
      background: #000; /* Черный фон на случай, если игра не отрисует свой */
    }
  </style>
</head>

<body>
  <div class="main-container">
    <!-- Панель управления для выбора игры -->
    <div class="controls-panel">
      <label for="game-selector">Выберите игру:</label>
      <select id="game-selector"></select>
      <button id="load-game-btn">Загрузить</button>
    </div>

    <!-- Контейнер для игрового холста -->
    <div class="canvas-container">
      <canvas id="main_canvas"></canvas>
    </div>
  </div>

  <script>
    // =================================================================
    // ЦЕНТР КОНФИГУРАЦИИ ИГР
    // =================================================================
    const GAME_CONFIGS = {
      'milkyFly/draw_script_mf_19_5.js': {
        name: 'Milky Fly',
        initData: {
          seed: Date.now().toString(16),
          best_score: sessionStorage.getItem('milkyFlyBestScore') || 0,
          entrances: (parseInt(sessionStorage.getItem('milkyFlyEntrances') || 0) + 1).toString(),
          version: "Local Test Harness v2"
        },
        onFinish: (gameData) => {
            console.log("Игра Milky Fly завершена!", gameData);
            const currentBest = parseInt(sessionStorage.getItem('milkyFlyBestScore') || 0);
            if (gameData.score > currentBest) {
                sessionStorage.setItem('milkyFlyBestScore', gameData.score);
                console.log(`Новый рекорд: ${gameData.score}`);
            }
        },
        onInit: () => {
          const entrances = parseInt(sessionStorage.getItem('milkyFlyEntrances') || 0) + 1;
          sessionStorage.setItem('milkyFlyEntrances', entrances);
        }
      },
      'match3/draw_script_match3_classes_3_2c.js': {
        name: 'Match 3',
        initData: {
          seed: Date.now().toString(16),
          trainingCount: ( 0).toString(),
          maxStepsCount: '20',
          targetItemsCount: '15',
          version: "Local Test Harness v2"
        },
        onFinish: (gameData) => {
          console.log("Игра Match 3 завершена!", gameData);
          const currentBest = parseInt(sessionStorage.getItem('match3BestScore') || 0);
          if (gameData.score > currentBest) {
              sessionStorage.setItem('match3BestScore', gameData.score);
              console.log(`Новый рекорд в Match 3: ${gameData.score}`);
          }
        },
        onInit: () => {
          const count = parseInt(sessionStorage.getItem('match3TrainingCount') || 0) + 1;
          sessionStorage.setItem('match3TrainingCount', count.toString());
        }
      },
      'memory/draw_script_memory_classes_5_1c.js': {
        name: 'Memory',
        initData: {
          seed: Date.now().toString(16),
          trainingCount: (sessionStorage.getItem('memoryTrainingCount') || 0).toString(),
          maxStepsCount: '40',
          targetItemsCount: '10', // Количество пар для победы
          version: "Local Test Harness v2"
        },
        onFinish: (gameData) => {
          console.log("Игра Memory завершена!", gameData);
          const currentBest = parseInt(sessionStorage.getItem('memoryBestScore') || 0);
          if (gameData.score > currentBest) {
              sessionStorage.setItem('memoryBestScore', gameData.score.toString());
              console.log(`Новый рекорд в Memory: ${gameData.score}`);
          }
        },
        onInit: () => {
          const count = parseInt(sessionStorage.getItem('memoryTrainingCount') || 0) + 1;
          sessionStorage.setItem('memoryTrainingCount', count.toString());
        }
      },
    };

    const canvas = document.getElementById("main_canvas");
    const gameSelector = document.getElementById("game-selector");
    const loadButton = document.getElementById("load-game-btn");
    let currentGameObject = null;

    function populateSelector() {
      for (const scriptPath in GAME_CONFIGS) {
        const option = document.createElement("option");
        option.value = scriptPath;
        option.textContent = GAME_CONFIGS[scriptPath].name;
        gameSelector.appendChild(option);
      }
    }

    /**
     * Основная функция загрузки и инициализации игры.
     */
    async function loadGame() {
      if (currentGameObject && typeof currentGameObject.deinit === 'function') {
        console.log("Очистка предыдущей игры...");
        currentGameObject.deinit(canvas, currentGameObject.tmp);
        currentGameObject = null;
      }
      
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const scriptPath = gameSelector.value;
      const config = GAME_CONFIGS[scriptPath];
      if (!config) {
        console.error("Конфигурация для игры не найдена:", scriptPath);
        return;
      }
      
      console.log(`Загрузка модуля: ${config.name}`);

      try {
        const gameModule = await import('./' + scriptPath);

        if (typeof gameModule.init !== 'function' || typeof gameModule.deinit !== 'function') {
            console.error(`Функции init() или deinit() не найдены в экспортах модуля: ${scriptPath}.`);
            return;
        }

        const tmp = {};
        
        const finishFunc = (gameData) => {
            console.log("Игра завершена, вызвана finishFunc.");
            if (config.onFinish) {
                config.onFinish(gameData);
            }
            console.log("FINISH -> DEINIT");
            gameModule.deinit(canvas, tmp);
        };

        console.log("Модуль импортирован. Запуск init()...");
        if (config.onInit) {
          config.onInit();
        }
        gameModule.init(canvas, config.initData, tmp, finishFunc);
        
        currentGameObject = {
          deinit: gameModule.deinit, // Сохраняем ссылку на функцию очистки из модуля
          tmp: tmp,
        };

      } catch (error) {
        console.error("Ошибка при динамическом импорте скрипта:", scriptPath, error);
      }
    }

    document.addEventListener("DOMContentLoaded", populateSelector);
    loadButton.addEventListener("click", loadGame);
  </script>
</body>

</html>
