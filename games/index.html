<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
    rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <script id="myscript" src="./memory/draw_script_memory_classes.js"></script>
</head>

<body style="body {
  width: 100%; 
  user-select: none;
  outline: none;

  margin: 0;
}
">
  <div style="
    display: grid;
  grid-template-rows: 1fr auto;
  height: 100vh;  
  ">
    <div style="
      overflow-y: auto;
      min-height: 0;
      ">
      <div style="  
      width: 100vw;
      height: 100%;
      background-color: #eac49c;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
      ">
          <canvas id="main_canvas" width="1280" height="720" style="  
          display: block;
        max-width: 100%;
        height: auto;
        "></canvas>
      </div>
    </div>
  </div>

  <script>
    const tmp = {};
    const canvas = document.getElementById("main_canvas");
    const script = document.getElementById("myscript");
    console.log(script);

    const finishFunc = (gameData) => {
      console.log("FINISH");
      if (script.deinit) {
        deinit(canvas, tmp);
      }
    };
    if (init) {
      console.log("LAUNCH!");
      init(canvas, {}, tmp, finishFunc);
    }
  </script>

</body>

</html>
