events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    server {
        listen 443 default_server ssl http2;
        listen [::]:443 ssl http2;

        server_name milkclub.lambumiz.ru;

        ssl_certificate /etc/letsencrypt/live/milkclub.lambumiz.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/milkclub.lambumiz.ru/privkey.pem;
        
        location / {
            proxy_pass http://server:8080;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        location /static/ {
            alias /app/static/;
        }

        location /media/ {
            alias /app/media/;
        }
    }

    server {
        listen 80;
        listen [::]:80;

        server_name milkclub.lambumiz.ru www.milkclub.lambumiz.ru;
        server_tokens off;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://milkclub.lambumiz.ru$request_uri;
        }

    }
}