services:
  bot:
    build: ./Bot
    environment:
      - MINIAPP_BOT_TOKEN=${MINIAPP_BOT_TOKEN}
      - SITE_HOST=${SITE_HOST}
      - MYSQL_DB_USER=${MYSQL_DB_USER}
      - MYSQL_DB_PASSWORD=${MYSQL_DB_PASSWORD}
    links:
      - mysql:mysql
    depends_on:
      mysql:
        condition: service_healthy
  
  score_app:
    build: ./Score_app
    environment:
      - DATA_LIFE_TIME=${DATA_LIFE_TIME}
      - CLEAR_TIME=${CLEAR_TIME}
    links:
      - redis:redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./games:/app/games

  server:
    build: ./Server
    ports:
      - 8080:8080
    links:
      - redis:redis
      - mysql:mysql
      - score_app:score_app
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - MYSQL_DB_USER=${MYSQL_DB_USER}
      - MYSQL_DB_PASSWORD=${MYSQL_DB_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
      - ./games:/app/games
    
  redis:
    image: redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      timeout: 20s
      retries: 10
  
  mysql:
    image: mysql
    environment:
      MYSQL_DATABASE: "Paperdb"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_DB_PASSWORD}
      MYSQL_USER: ${MYSQL_DB_USER}
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10